      summary: Move targets the source or one of its descendants
      value:
        code: ORG_CYCLE
        message: Organization cannot be moved into itself or its subtree.
        request_id: req_01
    MaxDepthExceededExample:
      summary: Move would exceed four levels
      value:
        code: ORG_MAX_DEPTH_EXCEEDED
        message: Organization move would exceed the maximum depth of 4.
        request_id: req_01
    ActiveChildrenConflictExample:
      summary: Deactivation blocked by active descendants
      value:
        code: ORG_HAS_ACTIVE_CHILDREN
        message: Organization has active children.
        request_id: req_01
    ActiveMembersConflictExample:
      summary: Deactivation blocked by active members
      value:
        code: ORG_HAS_ACTIVE_MEMBERS
        message: Organization has active members.
        request_id: req_01
    RootProtectedExample:
      summary: Root creation or deactivation is protected
      value:
        code: ORG_ROOT_PROTECTED
        message: The tenant root organization is protected.
        request_id: req_01
    InvalidStateExample:
      summary: Lifecycle state transition is invalid
      value:
        code: ORG_INVALID_STATE
        message: Organization state transition is not allowed.
        request_id: req_01
    IdempotencyReusedExample:
      summary: Idempotency key reused with a different request body
      value:
        code: IDEMPOTENCY_KEY_REUSED
        message: Idempotency-Key was already used with a different request.
        request_id: req_01
    IdempotencyInProgressExample:
      summary: Original request with the same key is still in progress
      value:
        code: IDEMPOTENCY_IN_PROGRESS
        message: A request with the same Idempotency-Key is still in progress.
        request_id: req_01
    VersionConflictExample:
      summary: If-Match version is stale
      value:
        code: ORG_VERSION_CONFLICT
        message: Organization has changed since the supplied version.
        details:
          expected_version: 5
        request_id: req_01
    PreconditionRequiredExample:
      summary: If-Match header is missing
      value:
        code: PRECONDITION_REQUIRED
        message: If-Match header is required.
        request_id: req_01
    RateLimitedExample:
      summary: Request rate limit exceeded
      value:
        code: RATE_LIMITED
        message: Request rate limit exceeded.
        request_id: req_01
    ServerErrorExample:
      summary: Server or dependency failure
      value:
        code: ORG_SERVER_ERROR
        message: The organization service is temporarily unavailable.
        request_id: req_01
    BadGatewayExample:
      summary: Upstream dependency failed
      value:
        code: ORG_SERVER_ERROR
        message: An upstream dependency failed.
        request_id: req_01
    ServiceUnavailableExample:
      summary: Service is temporarily unavailable
      value:
        code: ORG_SERVER_ERROR
        message: The organization service is temporarily unavailable.
        request_id: req_01
  schemas:
    OrganizationStatus:
      type: string
      enum: [active, inactive]
    OrganizationType:
      type: string
      enum: [company, department, team, other]
    Organization:
      type: object
      required:
        - tenant_id
        - id
        - code
        - name
        - type
        - status
        - parent_id
        - sort_order
        - leader_user_id
        - description
        - depth
        - version
        - created_at
        - updated_at
        - inactive_at
      properties:
        tenant_id:
          type: string
          description: Server-injected tenant boundary.
        id:
          type: string
          description: Opaque immutable resource ID.
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/OrganizationType'
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        parent_id:
          type: [string, 'null']
        sort_order:
          type: integer
          minimum: 0
          maximum: 1000000
        leader_user_id:
          type: [string, 'null']
        description:
          type: [string, 'null']
          maxLength: 2000
        depth:
          type: integer
          minimum: 1
          maximum: 4
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        inactive_at:
          type: [string, 'null']
          format: date-time
    OrganizationTreeNode:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationTreeNode'
    OrganizationCreateRequest:
      type: object
      additionalProperties: false
      required: [parent_id, code, name, type, sort_order]
      properties:
        parent_id:
          type: string
          minLength: 1
          description: Required; ordinary creation cannot create a root.
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/OrganizationType'
        sort_order:
          type: integer
          minimum: 0
          maximum: 1000000
        leader_user_id:
          type: [string, 'null']
        description:
          type: [string, 'null']
          maxLength: 2000
    OrganizationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/OrganizationType'
        sort_order:
          type: integer
          minimum: 0
          maximum: 1000000
        leader_user_id:
          type: [string, 'null']
        description:
          type: [string, 'null']
          maxLength: 2000
    OrganizationMoveRequest:
      type: object
      additionalProperties: false
      required: [target_parent_id, sort_order]
      properties:
        target_parent_id:
          type: string
          minLength: 1
        sort_order:
          type: integer
          minimum: 0
          maximum: 1000000
    OrganizationStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        reason:
          type: string
          maxLength: 500
    Pagination:
      type: object
      additionalProperties: false
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    OrganizationListResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        pagination:
          $ref: '#/components/schemas/Pagination'
    OrganizationTreeMeta:
      type: object
      additionalProperties: false
      required: [root_id, include_inactive, max_depth, truncated]
      properties:
        root_id:
          type: [string, 'null']
        include_inactive:
          type: boolean
        max_depth:
          type: integer
          minimum: 1
          maximum: 4
        truncated:
          type: boolean
    OrganizationTreeResponse:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationTreeNode'
        meta:
          $ref: '#/components/schemas/OrganizationTreeMeta'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: '#/components/schemas/OrganizationErrorCode'
        message:
          type: string
          description: Non-sensitive diagnostic message; UI must not branch on it.
        details:
          type: object
          additionalProperties: true
          properties:
            fields:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
        request_id:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Wire field path, for example code or sort_order.
        code:
          type: string
          description: Field-level validation code for frontend mapping.
        message:
          type: string
          description: Non-sensitive diagnostic message; UI must not display it verbatim.
    OrganizationErrorCode:
      type: string
      description: Stable business error code for frontend mapping and contract tests.
      enum:
        - ORG_VALIDATION_FAILED
        - UNAUTHORIZED
        - ORG_FORBIDDEN
        - ORG_NOT_FOUND
        - ORG_PARENT_NOT_FOUND
        - ORG_LEADER_NOT_FOUND
        - ORG_CODE_CONFLICT
        - ORG_PARENT_INACTIVE
        - ORG_CYCLE
        - ORG_MAX_DEPTH_EXCEEDED
        - ORG_HAS_ACTIVE_CHILDREN
        - ORG_HAS_ACTIVE_MEMBERS
        - ORG_ROOT_PROTECTED
        - ORG_INVALID_STATE
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - ORG_VERSION_CONFLICT
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - ORG_SERVER_ERROR
  responses:
    ValidationError:
      description: Request validation failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              $ref: '#/components/examples/ValidationErrorExample'
    Unauthorized:
      description: Missing, expired or revoked session.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              $ref: '#/components/examples/UnauthorizedExample'
    Forbidden:
      description: Authenticated but missing the required functional permission.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              $ref: '#/components/examples/ForbiddenExample'
    OrganizationNotFound:
      description: Organization does not exist or is outside the caller's data scope.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/OrganizationNotFoundExample'
    ParentNotFound:
      description: Source, parent or leader does not exist or is outside the caller's writable scope.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            parentNotFound:
              $ref: '#/components/examples/ParentNotFoundExample'
            leaderNotFound:
              $ref: '#/components/examples/LeaderNotFoundExample'
    Conflict:
      description: Business state conflict; inspect the stable error code.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            codeConflict:
              $ref: '#/components/examples/CodeConflictExample'
            parentInactive:
              $ref: '#/components/examples/ParentInactiveExample'
            cycle:
              $ref: '#/components/examples/CycleDetectedExample'
            maxDepth:
              $ref: '#/components/examples/MaxDepthExceededExample'
            activeChildren:
              $ref: '#/components/examples/ActiveChildrenConflictExample'
            activeMembers:
              $ref: '#/components/examples/ActiveMembersConflictExample'
            rootProtected:
              $ref: '#/components/examples/RootProtectedExample'
            invalidState:
              $ref: '#/components/examples/InvalidStateExample'
            idempotencyReused:
              $ref: '#/components/examples/IdempotencyReusedExample'
            idempotencyInProgress:
              $ref: '#/components/examples/IdempotencyInProgressExample'
    PreconditionRequired:
      description: Required If-Match precondition is missing.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            preconditionRequired:
              $ref: '#/components/examples/PreconditionRequiredExample'
    PreconditionFailed:
      description: If-Match version is stale; reload the resource.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              $ref: '#/components/examples/VersionConflictExample'
    RateLimited:
      description: Rate limit exceeded. Honor Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/RateLimitedExample'
    ServerError:
      description: Server or dependency failure. The client must not assume success.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverError:
              $ref: '#/components/examples/ServerErrorExample'
    BadGateway:
      description: Upstream dependency failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badGateway:
              $ref: '#/components/examples/BadGatewayExample'
    ServiceUnavailable:
      description: Service is temporarily unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serviceUnavailable:
              $ref: '#/components/examples/ServiceUnavailableExample'
