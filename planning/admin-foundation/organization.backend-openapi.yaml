x-backend-implementation-notes:
  tenant-context: tenant_id is injected from the verified session; ordinary APIs must reject client-selected tenant switching.
  data-scope: Only self, org, org_subtree and all are allowed; all means current tenant only.
  transaction: Create, update, move and status changes must be transactional and enforce root, depth, cycle, active-child and active-member invariants.
  idempotency: POST create/move/status require Idempotency-Key; retention TTL, fingerprint and cleanup task require backend approval.
  concurrency: PATCH, move and status require ETag/If-Match; missing returns 428, stale returns 412, business conflicts return 409.
  audit: High-risk writes use audit_event_v1 in the business transaction; Outbox write failure fails the transaction closed. Denied access uses an independent reliable security channel.
  permission-version: Successful permission-affecting writes must increment permissions_version and define refresh/invalidation behavior.
  last-admin: Last platform administrator and per-tenant last tenant administrator checks must be atomic; no check-then-write.
  errors: Stable business error codes and request_id are required; clients must fail closed on unknown codes.
