components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly server session cookie; token contents are never exposed to the frontend.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Client-generated correlation ID; the server echoes or replaces it.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: CSRF header required for state-changing requests by the existing frontend contract.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Scoped to tenant, actor, method, path and request body hash.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      description: ETag/version precondition, for example "3".
  headers:
    ETag:
      description: Quoted organization version, for example "3".
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    Location:
      description: Created organization resource URL.
      schema:
        type: string
        format: uri-reference
    XRequestId:
      description: Request correlation ID.
      schema:
        type: string
  examples:
    OrganizationCreated:
      summary: New active department
      value:
        tenant_id: tenant_01
        id: org_platform
        code: PLATFORM
        name: Platform Engineering
        type: department
        status: active
        parent_id: org_hq
        sort_order: 20
        leader_user_id: null
        description: Platform engineering organization
        depth: 2
        version: 3
        created_at: '2026-11-01T08:00:00Z'
        updated_at: '2026-11-14T08:30:00Z'
        inactive_at: null
    OrganizationUpdated:
      summary: Organization base data updated
      value:
        tenant_id: tenant_01
        id: org_platform
        code: PLATFORM
        name: Platform and Infrastructure
        type: department
        status: active
        parent_id: org_hq
        sort_order: 15
        leader_user_id: user_01
        description: Platform and infrastructure organization
        depth: 2
        version: 4
        created_at: '2026-11-01T08:00:00Z'
        updated_at: '2026-11-15T02:00:00Z'
        inactive_at: null
    OrganizationMoved:
      summary: Organization moved under a new parent
      value:
        tenant_id: tenant_01
        id: org_platform
        code: PLATFORM
        name: Platform and Infrastructure
        type: department
        status: active
        parent_id: org_operations
        sort_order: 10
        leader_user_id: user_01
        description: Platform and infrastructure organization
        depth: 2
        version: 5
        created_at: '2026-11-01T08:00:00Z'
        updated_at: '2026-11-15T02:10:00Z'
        inactive_at: null
    OrganizationDeactivated:
