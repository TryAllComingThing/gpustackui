info:
  title: Organization API - Backend Handoff Draft
  summary: Tenant-scoped organization API draft for backend implementation and reconciliation.
  version: 0.3.0-backend-draft
  contact:
    name: Backend and frontend contract owners
  description: |
    Backend handoff draft generated from the admin-foundation planning documents
    on 2026-11-15. It is intended to give the backend a complete, machine-readable
    starting point for implementation and reconciliation.

    This file is NOT evidence that the backend has implemented these endpoints,
    and it is NOT a signed backend contract. The backend must return a real
    OpenAPI 3.1 document with its actual topology, security settings, storage,
    transaction, idempotency, permission-version and audit semantics. No frontend
    request function may be created from this draft before G1 and G2 close.

    Canonical proposal: organization.openapi.yaml. This handoff draft must be
    reconciled against that proposal and the planning documents listed below.
    Product decisions confirmed on 2026-11-15: ordinary tenant APIs never accept
    a client-selected tenant; cross-tenant operations use a separate /platform/*
    surface; organization lifecycle is status-only (no delete or restore).
