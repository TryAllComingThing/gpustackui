    - authentication, CSRF, request tracing and cookie settings
    - tenant injection point and forbidden client-selected tenant mechanisms
    - field types, limits, stable error codes and idempotency retention
    - audit outbox, permission-version invalidation and transaction behavior
  requiredOutputs:
